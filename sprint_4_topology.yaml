lab:
  description: CS 457 Sprint 4 - single-router (R1) topology with three routed subnets,
    R1 DHCP for both clients, R1 authoritative DNS for server.reynolds.edu, and NAT
    to an External Connector.
  notes: |-
    Subnet A 192.168.10.0/24  ar-Client1  <-> R1 Gi0/1 (192.168.10.1)  DHCP CLIENT1_POOL
    Subnet B 192.168.11.0/24  ar-Client2  <-> R1 Gi0/2 (192.168.11.1)  DHCP CLIENT2_POOL
    Subnet C 192.168.20.0/24  ar-Server   <-> R1 Gi0/3 (192.168.20.1)  static 192.168.20.100
    Outside  192.168.255.0/24 ext-conn    <-> R1 Gi0/0 (DHCP, NAT outside)
    DNS: ip host server.reynolds.edu 192.168.20.100
    Alpine login: cisco / cisco
  title: CS457 Sprint 4 - Reynolds Battleship Network
  version: 0.2.2
links:
  - id: l0
    n1: n0
    n2: n1
    i1: i1
    i2: i0
    label: ar-R1-Gi0/0<->ext-conn-port
  - id: l1
    n1: n0
    n2: n2
    i1: i2
    i2: i0
    label: ar-R1-Gi0/1<->ar-Client1-eth0
  - id: l2
    n1: n0
    n2: n3
    i1: i3
    i2: i0
    label: ar-R1-Gi0/2<->ar-Client2-eth0
  - id: l3
    n1: n0
    n2: n4
    i1: i4
    i2: i0
    label: ar-R1-Gi0/3<->ar-Server-eth0
nodes:
  - boot_disk_size: null
    configuration: |-
      hostname R1
      !
      ! Sprint 4 Section 2.1 - Layer 3 forwarding between directly connected subnets
      ip routing
      !
      ! Sprint 4 Section 2.3 - DHCP pools for Client 1 and Client 2
      ip dhcp excluded-address 192.168.10.1
      ip dhcp excluded-address 192.168.11.1
      !
      ip dhcp pool CLIENT1_POOL
       network 192.168.10.0 255.255.255.0
       default-router 192.168.10.1
       dns-server 192.168.10.1
      !
      ip dhcp pool CLIENT2_POOL
       network 192.168.11.0 255.255.255.0
       default-router 192.168.11.1
       dns-server 192.168.11.1
      !
      ! Sprint 4 Section 2.4 - authoritative DNS for the game server
      ip domain lookup
      ip dns server
      ip host server.reynolds.edu 192.168.20.100
      !
      ! Sprint 4 Section 2.5 - uplink to the External Connector (NAT outside)
      interface GigabitEthernet0/0
       description Uplink to ext-conn (CML NAT 192.168.255.0/24)
       ip address dhcp
       ip nat outside
       no shutdown
      !
      ! Sprint 4 Section 2.1 - gateways for Subnets A, B and C (NAT inside)
      interface GigabitEthernet0/1
       description Subnet A gateway - ar-Client1
       ip address 192.168.10.1 255.255.255.0
       ip nat inside
       no shutdown
      !
      interface GigabitEthernet0/2
       description Subnet B gateway - ar-Client2
       ip address 192.168.11.1 255.255.255.0
       ip nat inside
       no shutdown
      !
      interface GigabitEthernet0/3
       description Subnet C gateway - ar-Server
       ip address 192.168.20.1 255.255.255.0
       ip nat inside
       no shutdown
      !
      ! Sprint 4 Section 2.5 - PAT for all three internal subnets out Gi0/0
      access-list 1 permit 192.168.10.0 0.0.0.255
      access-list 1 permit 192.168.11.0 0.0.0.255
      access-list 1 permit 192.168.20.0 0.0.0.255
      ip nat inside source list 1 interface GigabitEthernet0/0 overload
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      !
      end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    label: ar-R1
    node_definition: iosv
    ram: null
    tags: []
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i2
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i3
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i4
        label: GigabitEthernet0/3
        slot: 3
        type: physical
  - boot_disk_size: null
    configuration: NAT
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n1
    label: ext-conn
    node_definition: external_connector
    ram: null
    tags: []
    x: -320
    y: 0
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical
  - boot_disk_size: null
    configuration: |-
      # this is a shell script which will be sourced at boot
      hostname ar-Client1
      # configurable user account
      USERNAME=cisco
      PASSWORD=cisco
      # Sprint 4 Section 2.3 - bring eth0 up and request a lease from R1 (CLIENT1_POOL).
      # -b keeps retrying in the background if R1 is still booting.
      ip link set eth0 up
      udhcpc -i eth0 -b
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n2
    label: ar-Client1
    node_definition: alpine
    ram: null
    tags: []
    x: 240
    y: -240
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
  - boot_disk_size: null
    configuration: |-
      # this is a shell script which will be sourced at boot
      hostname ar-Client2
      # configurable user account
      USERNAME=cisco
      PASSWORD=cisco
      # Sprint 4 Section 2.3 - bring eth0 up and request a lease from R1 (CLIENT2_POOL).
      # -b keeps retrying in the background if R1 is still booting.
      ip link set eth0 up
      udhcpc -i eth0 -b
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n3
    label: ar-Client2
    node_definition: alpine
    ram: null
    tags: []
    x: -240
    y: -240
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
  - boot_disk_size: null
    configuration: |-
      # this is a shell script which will be sourced at boot
      hostname ar-Server
      # configurable user account
      USERNAME=cisco
      PASSWORD=cisco
      # Sprint 4 Section 2.2 - static IP, default gateway and resolver for the game server
      ip link set eth0 up
      ip addr add 192.168.20.100/24 dev eth0
      ip route add default via 192.168.20.1
      echo "nameserver 192.168.20.1" > /etc/resolv.conf
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n4
    label: ar-Server
    node_definition: alpine
    ram: null
    tags: []
    x: 0
    y: 240
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
